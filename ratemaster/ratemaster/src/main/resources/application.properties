spring.application.name=ratemaster
# Server port
server.port=8081

# Database
spring.datasource.driver-class-name= org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ratemaster
spring.datasource.username=postgres
spring.datasource.password=root@123

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# App config
app.finstream-url=http://localhost:9090

#Algorithm : FIXED_WINDOW,SLIDING_WINDOW,TOKEN_BUCKET
app.rate-limit.algorithm=SLIDING_WINDOW






